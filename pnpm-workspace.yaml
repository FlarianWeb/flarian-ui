# Точные версии без ^: иначе две установки одного коммита получают разный код.
saveExact: true

# Версии младше суток не ставятся (дефолт pnpm 11+): время заметить и отозвать скомпрометированный выпуск.
# Свои пакеты исключены — выпуск frontend-preset или language-plugin должен подключаться сразу.
minimumReleaseAgeExclude:
  - '@flarian/*'

# vite-node из Histoire тянет vite 7: без подмены в dev и сборке оказались бы две копии Vite с разными плагинами.
overrides:
  vite: 8.1.5

# Бинарник esbuild приходит платформенной зависимостью, его postinstall только перепроверяет её.
allowBuilds:
  esbuild: false
